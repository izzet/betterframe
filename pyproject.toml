[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betterframe"
version = "0.2.1"
description = "Write a dataframe pipeline once, run it on Dask or pandas"
authors = [{ name = "Izzet Yildirim", email = "izzetcyildirim@gmail.com" }]
maintainers = [{ name = "Izzet Yildirim", email = "izzetcyildirim@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["betterset>=0.2.0", "pandas>=1.5"]
keywords = ["dask", "pandas", "dataframe", "meta", "partitions", "aggregation", "set", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Dask is only needed to drive Dask frames; a pandas-only caller needs nothing.
dask = ["dask[dataframe]>=2023.1.0"]

[project.urls]
Homepage = "https://github.com/izzet/betterframe"
Repository = "https://github.com/izzet/betterframe"
Documentation = "https://github.com/izzet/betterframe#readme"
"Bug Tracker" = "https://github.com/izzet/betterframe/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.12.5",
    "pre-commit>=3.0.0",
    "dask[dataframe]>=2023.1.0",
]
